<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Vibrant Electric Purple Gradient for Smart AI Resume Analyzer -->
    <linearGradient id="bgResume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210838" />
      <stop offset="50%" stop-color="#3d125f" />
      <stop offset="100%" stop-color="#120321" />
    </linearGradient>

    <!-- Glowing Violet Text Gradient -->
    <linearGradient id="resumeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E086FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgResume)" rx="16" />

  <!-- Grid Pattern -->
  <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800" stroke="rgba(168, 85, 247, 0.15)" stroke-width="1" />
  <path d="M160 0 V350 M320 0 V350 M480 0 V350 M640 0 V350" stroke="rgba(168, 85, 247, 0.15)" stroke-width="1" />

  <!-- Vibrant Orbs -->
  <circle cx="220" cy="180" r="190" fill="#D500F9" opacity="0.32" filter="blur(60px)" />
  <circle cx="580" cy="150" r="180" fill="#A855F7" opacity="0.32" filter="blur(60px)" />

  <style>
    .resume-title {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: 4px;
      fill: url(#resumeGrad);
      filter: drop-shadow(0px 0px 25px rgba(168, 85, 247, 0.9));
    }
  </style>

  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="resume-title">
    SMART AI RESUME ANALYZER
  </text>
</svg>
