<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Vibrant Cyan-Blue Gradient for Smart CRM -->
    <linearGradient id="bgCrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031b33" />
      <stop offset="50%" stop-color="#0a2e52" />
      <stop offset="100%" stop-color="#020b17" />
    </linearGradient>

    <!-- Glowing Cyan Text Gradient -->
    <linearGradient id="crmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgCrm)" rx="16" />

  <!-- Grid Pattern -->
  <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1" />
  <path d="M160 0 V350 M320 0 V350 M480 0 V350 M640 0 V350" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1" />

  <!-- Vibrant Orbs -->
  <circle cx="200" cy="120" r="200" fill="#00F2FE" opacity="0.3" filter="blur(60px)" />
  <circle cx="600" cy="220" r="180" fill="#00C6FF" opacity="0.3" filter="blur(60px)" />

  <style>
    .crm-title {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 7px;
      fill: url(#crmGrad);
      filter: drop-shadow(0px 0px 25px rgba(0, 242, 254, 0.9));
    }
  </style>

  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="crm-title">
    SMART CRM
  </text>
</svg>
