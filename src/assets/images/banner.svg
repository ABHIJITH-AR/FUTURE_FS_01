<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D500F9" />
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .banner-text {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 82px;
      letter-spacing: 14px;
      fill: url(#textGradient);
      filter: drop-shadow(0px 0px 20px rgba(0, 229, 255, 0.4)) drop-shadow(0px 0px 35px rgba(168, 85, 247, 0.4));
    }
  </style>

  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="banner-text">
    ABHIJITH AR
  </text>
</svg>
