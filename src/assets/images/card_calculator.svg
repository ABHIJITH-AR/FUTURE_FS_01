<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Vibrant Neon Amber & Gold Gradient for Simple Calculator -->
    <linearGradient id="bgCalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332002" />
      <stop offset="50%" stop-color="#523506" />
      <stop offset="100%" stop-color="#190e01" />
    </linearGradient>

    <!-- Glowing Amber Text Gradient -->
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgCalc)" rx="16" />

  <!-- Grid Pattern -->
  <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1" />
  <path d="M160 0 V350 M320 0 V350 M480 0 V350 M640 0 V350" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1" />

  <!-- Vibrant Orbs -->
  <circle cx="260" cy="160" r="190" fill="#F59E0B" opacity="0.3" filter="blur(60px)" />
  <circle cx="560" cy="190" r="180" fill="#FBBF24" opacity="0.3" filter="blur(60px)" />

  <style>
    .calc-title {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 5px;
      fill: url(#calcGrad);
      filter: drop-shadow(0px 0px 25px rgba(245, 158, 11, 0.9));
    }
  </style>

  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="calc-title">
    SIMPLE CALCULATOR
  </text>
</svg>
